name: Python Quality

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: python-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Python repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Compile Python files
        run: python -m compileall -q clothing_assistant tests

      - name: Ruff lint
        run: ruff check clothing_assistant tests

      - name: Docstring coverage
        run: interrogate -v -i --fail-under=30 clothing_assistant

      - name: Unit and contract tests
        env:
          PYTHON_DOTENV_DISABLED: "1"
          OUTFIT_CONTRACT_ROOT: ${{ github.workspace }}/contracts
        run: python -m pytest -q
